<!doctype html>

ed);line-height:1.6}.hidden{display:none}.searches code{display:inline-block;margin:4px;padding:7px 9px;background:#f4f1f5;border-radius:8px}@media(max-width:520px){.card{padding:20px}.hero h1{font-size:25px}.question h2{font-size:20px}}</style></head><body><div class="wrap"><div class="card"><div class="brand">TOVERICH · AI YOUTUBE PLAYLIST</div><section id="start" class="hero"><div style="font-size:54px">🎧</div><h1>나의 AI 플레이리스트 취향 찾기</h1><p>10가지 쉬운 질문에 답하면<br>나에게 어울리는 음악 장르 3개와<br>유튜브 플레이리스트 방향을 추천해드려요.</p><button class="primary" onclick="begin()">내 음악 취향 찾아보기</button><p class="small">정답을 맞히는 테스트가 아니에요. 처음 어떤 음악부터 탐색하면 좋을지 찾는 도구입니다.</p></section><section id="quiz" class="hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="qno" id="qno"></div><div class="question"><h2 id="qtext"></h2></div><div class="opts" id="opts"></div><div class="nav"><button class="secondary" onclick="prev()">이전</button><button class="primary" id="next" onclick="next()">다음</button></div></section><section id="result" class="hidden"><span class="badge">나의 추천 결과</span><h1 id="rtype"></h1><p id="rdesc"></p><div id="ranks"></div><h3>🎵 첫 플레이리스트 아이디어</h3><div class="idea" id="idea"></div><h3>🔎 YouTube에서 찾아볼 검색어</h3><div class="searches" id="searches"></div><div class="summary" id="summary"></div><p class="small">※ 7080·CCM 등은 특정 기존 곡을 복제하는 의미가 아니라, 해당 시대감·분위기·주제를 참고한 새로운 창작 음악 방향을 뜻합니다.</p><button class="primary" onclick="window.print()">결과 카드 저장/인쇄</button><div style="height:10px"></div><button class="secondary" onclick="restart()">다시 테스트하기</button></section></div></div><script>
const genres=["Piano Jazz","Cafe Jazz","Bossa Nova","Lo-fi","Relaxing Piano","Acoustic/Folk","City Pop","Synth Pop","7080 Old Pop","7080 Folk/Ballad","Trot","Trot Ballad","CCM/Worship","Healing/Meditation"];
const Q=[
["어떤 느낌의 음악이 가장 끌리나요?",[["따뜻하고 편안한 음악",{"Cafe Jazz":3,"Piano Jazz":2,"Relaxing Piano":2}],["젊은 시절의 추억이 떠오르는 음악",{"7080 Old Pop":3,"7080 Folk/Ballad":3,"Trot Ballad":1}],["정겹고 흥겨운 음악",{"Trot":4,"Trot Ballad":2}],["기도·감사·위로가 느껴지는 음악",{"CCM/Worship":5,"Healing/Meditation":1}],["세련되고 도시적인 음악",{"City Pop":4,"Synth Pop":3}],["조용하고 차분한 음악",{"Relaxing Piano":3,"Healing/Meditation":3,"Lo-fi":2}]]],
["어떤 소리가 가장 마음에 드나요?",[["부드러운 피아노",{"Piano Jazz":4,"Relaxing Piano":4,"CCM/Worship":1}],["분위기 있는 색소폰",{"Cafe Jazz":3,"Piano Jazz":2}],["따뜻한 통기타",{"Acoustic/Folk":4,"7080 Folk/Ballad":4,"CCM/Worship":1}],["신시사이저·전자음",{"Synth Pop":4,"City Pop":4}],["구성진 노래와 리듬",{"Trot":5,"Trot Ballad":2}],["특별한 악기보다 전체 분위기가 중요",{"Healing/Meditation":2,"Lo-fi":2,"Cafe Jazz":1}]]],
["목소리와 가사는 어느 쪽이 좋은가요?",[["악기 연주만 있는 음악",{"Piano Jazz":3,"Cafe Jazz":3,"Lo-fi":3,"Relaxing Piano":3,"Healing/Meditation":2}],["가사가 마음에 와닿는 음악",{"7080 Old Pop":3,"7080 Folk/Ballad":3,"Trot Ballad":3,"CCM/Worship":3}],["따라 부를 수 있는 노래",{"Trot":4,"7080 Old Pop":3,"CCM/Worship":2}],["둘 다 좋다",{"Acoustic/Folk":2,"Bossa Nova":2,"City Pop":2}]]],

["음악의 빠르기는 어느 정도가 좋나요?",[["아주 느리고 잔잔하게",{"Healing/Meditation":4,"Relaxing Piano":4,"Trot Ballad":1}],["편안하고 여유롭게",{"Cafe Jazz":3,"Piano Jazz":3,"Bossa Nova":2,"Acoustic/Folk":2}],["적당한 리듬감이 있게",{"7080 Old Pop":2,"City Pop":3,"Bossa Nova":3,"CCM/Worship":1}],["기분 좋게 경쾌하게",{"Trot":4,"City Pop":4,"Synth Pop":3}]]],

["누구에게 내 음악을 들려주고 싶나요?",[["공부하는 학생",{"Lo-fi":4,"Relaxing Piano":2}],["일하는 직장인",{"Cafe Jazz":4,"Piano Jazz":2,"City Pop":1}],["40~60대 중장년층",{"7080 Old Pop":4,"7080 Folk/Ballad":4,"Trot Ballad":3}],["시니어·부모님 세대",{"Trot":5,"Trot Ballad":4,"7080 Old Pop":3}],["신앙생활을 하는 사람",{"CCM/Worship":6}],["카페·여행을 좋아하는 사람",{"Bossa Nova":3,"Cafe Jazz":3,"City Pop":2}],["누구나 편하게",{"Relaxing Piano":2,"Healing/Meditation":2,"Cafe Jazz":2}]]],
["음악을 듣는 사람이 어떤 기분이 되었으면 좋겠나요?",[["마음이 편안해졌으면",{"Relaxing Piano":4,"Healing/Meditation":4,"Cafe Jazz":2}],["집중이 잘 되었으면",{"Lo-fi":5,"Piano Jazz":2}],["기분이 좋아졌으면",{"Bossa Nova":3,"City Pop":3,"Trot":3}],["위로받았으면",{"CCM/Worship":4,"Trot Ballad":3,"7080 Folk/Ballad":2}],["옛 추억에 잠겼으면",{"7080 Old Pop":5,"7080 Folk/Ballad":5,"Trot Ballad":2}],["신나고 흥겨웠으면",{"Trot":5,"Synth Pop":3,"City Pop":2}]]],
["어떤 시대감이나 스타일에 마음이 가나요?",[["1970~80년대 해외 팝 감성",{"7080 Old Pop":6}],["1970~80년대 통기타·포크 감성",{"7080 Folk/Ballad":6,"Acoustic/Folk":3}],["정겨운 트로트 감성",{"Trot":6,"Trot Ballad":3}],["요즘 감성의 카페 음악",{"Cafe Jazz":4,"Piano Jazz":2,"Bossa Nova":2}],["도시적이고 복고적인 감성",{"City Pop":5,"Synth Pop":3}],["시대보다 메시지와 평안이 중요",{"CCM/Worship":3,"Healing/Meditation":3,"Relaxing Piano":2}]]],
["마지막으로, 내가 음악을 만드는 가장 큰 이유는?",[["내가 좋아하는 음악을 오래 듣고 싶어서",{"Cafe Jazz":2,"Piano Jazz":2,"7080 Old Pop":2}],["추억과 감성을 나누고 싶어서",{"7080 Old Pop":4,"7080 Folk/Ballad":4,"Trot Ballad":2}],["사람들을 즐겁게 해주고 싶어서",{"Trot":4,"City Pop":2,"Bossa Nova":2}],["위로와 소망을 전하고 싶어서",{"CCM/Worship":5,"Trot Ballad":2,"Healing/Meditation":2}],["공부·일·휴식에 도움이 되고 싶어서",{"Lo-fi":3,"Relaxing Piano":3,"Cafe Jazz":3}]]]];
const meta={"Piano Jazz":["따뜻한 피아노형","부드러운 피아노 중심의 편안한 재즈","Morning Piano Jazz","햇살 좋은 아침, 커피와 함께 듣는 피아노 재즈"],"Cafe Jazz":["포근한 카페형","오래 틀어두기 좋은 따뜻한 카페 재즈","Cozy Cafe Jazz","조용히 일하고 싶은 오후의 카페 재즈"],"Bossa Nova":["산뜻한 여유형","가볍고 기분 좋은 보사노바·카페 음악","Bossa Nova Cafe","햇살과 커피가 어울리는 산뜻한 보사노바"],"Lo-fi":["차분한 집중형","공부와 작업에 방해되지 않는 잔잔한 비트","Lo-fi Study Music","집중이 필요한 오후의 로파이"],"Relaxing Piano":["평온한 피아노형","휴식과 독서를 위한 잔잔한 피아노","Relaxing Piano","하루 끝에 마음을 쉬게 하는 피아노"],"Acoustic/Folk":["따뜻한 통기타형","자연스럽고 인간적인 어쿠스틱·포크 감성","Acoustic Folk Playlist","통기타와 함께하는 편안한 오후"],"City Pop":["도시 드라이브형","도시적이고 복고적인 경쾌한 감성","City Pop Drive","밤길을 달리며 듣는 레트로 시티팝"],"Synth Pop":["레트로 신스형","신시사이저 중심의 세련되고 경쾌한 팝","Retro Synth Pop","기분 전환이 필요한 날의 신스팝"],"7080 Old Pop":["추억의 올드팝형","70~80년대 팝의 따뜻한 시대감을 살린 창작 음악","70s 80s Old Pop Style","라디오를 켜면 떠오르는 그 시절 감성의 창작 올드팝"],"7080 Folk/Ballad":["추억의 통기타형","통기타와 서정적인 멜로디가 어울리는 7080 감성","70s 80s Folk Ballad Style","통기타와 청바지, 그 시절을 떠올리는 창작 포크"],"Trot":["정겨운 흥겨움형","따라 부르기 쉽고 정겨운 리듬의 창작 트로트","Korean Trot Style","기분 좋은 날 함께 듣는 신나는 창작 트로트"],"Trot Ballad":["따뜻한 인생가형","위로와 인생 이야기를 담기 좋은 감성 트로트","Trot Ballad Style","하루 끝에 마음을 다독이는 창작 트로트 발라드"],"CCM/Worship":["감사와 소망형","기도·감사·위로·소망을 주제로 한 새로운 창작 음악","Original Worship Music","감사와 소망을 담은 창작 피아노 워십"],"Healing/Meditation":["고요한 힐링형","휴식과 마음의 안정을 돕는 잔잔한 음악","Healing Meditation Music","조용히 쉬고 싶은 날의 힐링 음악"]};
let idx=0,answers=Array(Q.length).fill(null);function begin(){start.classList.add('hidden');quiz.classList.remove('hidden');render()}function render(){bar.style.width=((idx+1)/Q.length*100)+'%';qno.textContent=`질문 ${idx+1} / ${Q.length}`;qtext.textContent=Q[idx][0];opts.innerHTML='';Q[idx][1].forEach((x,i)=>{let b=document.createElement('button');b.className='opt'+(answers[idx]===i?' sel':'');b.textContent=`${i+1}. ${x[0]}`;b.onclick=()=>{answers[idx]=i;render()};opts.appendChild(b)});next.textContent=idx===Q.length-1?'결과 보기':'다음'}function prev(){if(idx>0){idx--;render()}}function finish(){let s={};genres.forEach(g=>s[g]=0);answers.forEach((a,qi)=>Object.entries(Q[qi][1][a][1]).forEach(([g,v])=>s[g]+=v));let top=Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,3),main=top[0][0],m=meta[main];quiz.classList.add('hidden');result.classList.remove('hidden');rtype.textContent='🎧 '+m[0];rdesc.textContent=m[1];ranks.innerHTML=top.map((x,i)=>`<div class="rank"><strong>${i+1}순위 · ${x[0]}</strong><br><span class="small">추천 적합도 ${Math.round(x[1]/top[0][1]*100)}%</span></div>`).join('');idea.textContent=m[3];searches.innerHTML=[m[2],top[1][0]+' Playlist',top[2][0]+' Playlist'].map(t=>`<code>${t}</code>`).join('');summary.innerHTML=`<strong>나의 AI 플레이리스트 방향</strong><br>🎵 1순위 장르: ${main}<br>🎶 함께 탐색할 장르: ${top[1][0]}, ${top[2][0]}<br>✨ 방향: ${m[1]}<br><br><strong>나는 ${m[1]}을(를) 중심으로 나만의 AI 플레이리스트를 만들어보고 싶습니다.</strong>`;scrollTo({top:0,behavior:'smooth'})}function next(){if(answers[idx]===null){alert('가장 가까운 답 하나를 선택해 주세요.');return}idx<Q.length-1?(idx++,render()):finish()}function restart(){idx=0;answers=Array(Q.length).fill(null);result.classList.add('hidden');start.classList.remove('hidden');scrollTo(0,0)}
